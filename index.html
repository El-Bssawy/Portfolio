<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Moaz El-Bssawy" />
    <meta
      name="description"
      content="Moaz El-Bssawy — Front-End Developer building fast, accessible and pixel-perfect web experiences with React, JavaScript and modern CSS."
    />
    <meta
      name="keywords"
      content="Front-End Developer, React, JavaScript, HTML, CSS, SASS, Portfolio, Web Development, UI, UX"
    />
    <meta name="theme-color" content="#070b14" />
    <title>Moaz El-Bssawy — Front-End Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "dark";
          var lang = localStorage.getItem("lang") || "en";
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
